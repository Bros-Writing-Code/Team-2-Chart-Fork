name: "Publish Zing Plot Plus Plus"

push:
  branches:
    - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          scope: 'npm'
      - name: Install dependencies
        run: npm install
        working-directory: ./zing-plot-plus-plus
      - name: Publish
        run: npm publish
        working-directory: ./zing-plot-plus-plus
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}