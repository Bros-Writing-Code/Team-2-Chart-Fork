name: "Publish Zing Plot Plus Plus"

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm install
        working-directory: ./zing-plot-plus-plus
      - name: Test
        run: npm test
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "zing-plot-plus-plus@$VERSION" version 2>/dev/null)" ]; then
            echo "Version $VERSION is already on npm. Skipping publish."
          else
            npm publish
          fi
        working-directory: ./zing-plot-plus-plus
