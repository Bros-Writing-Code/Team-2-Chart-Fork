name: "Publish Zing Plot Plus Plus"

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get the current package version
        run: echo "CURRENT_VERSION=$(node -p "require('./zing-plot-plus-plus/package.json').version")" >> $GITHUB_ENV
      - name: Compare versions
        run: |
          if [ "$CURRENT_VERSION" != "${{ vars.LAST_VERSION }}" ]; then
            echo "Versions are different. Proceeding with publish."
          else
            echo "Versions are the same. Skipping publish."
            exit 1
          fi
      - name: Set publish version in variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh variable set LAST_VERSION -b "$CURRENT_VERSION"
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm install
        working-directory: ./zing-plot-plus-plus
      - name: Publish
        run: npm publish
        working-directory: ./zing-plot-plus-plus